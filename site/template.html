<style>
/* ==========================================================================
   ちるーむ v5.0
   色・書体・角丸・影は :root の変数だけを使う（生の色コードを直書きしない）
   ブレークポイント: 640px / 900px / 1080px（1080 の上書きは各セクションの 900 ブロックの後ろに書く）
   ========================================================================== */
:root {
  /* ブランド色 */
  --brand-sky: #CEF4F7;      /* ロゴ背景の実測値 */
  --mint: #C8EBE7;
  --mint-soft: #EAF6F4;
  --mint-deep: #95C9C0;
  --teal: #4FA89B;
  --teal-text: #2A7469;      /* 白地・ミント地で読める濃さ */
  --coral: #F08767;
  --coral-soft: #FBD3C4;
  --coral-deep: #D9613F;     /* 大きな文字・装飾用（小さな本文には使わない） */
  --yellow: #FBCD4F;
  --yellow-soft: #FDE9B0;
  /* 文字・地 */
  --ink: #22353A;
  --charcoal: #2E3D3F;
  --charcoal-soft: #5E6F71;
  --charcoal-faint: #8DA0A2; /* 装飾専用（文字には使わない） */
  --line: #D8E9E6;
  --paper: #FFFFFF;
  /* SNS のブランド色 */
  --line-green: #06C755;
  --facebook-blue: #1877F2;
  --linkedin-blue: #0A66C2;
  /* 透過・影（ink = rgb(34,53,58) の透過） */
  --ink-06: rgba(34, 53, 58, .06);
  --ink-10: rgba(34, 53, 58, .10);
  --ink-14: rgba(34, 53, 58, .14);
  --glass: rgba(255, 255, 255, .86);
  --glass-strong: rgba(255, 255, 255, .94);
  --shadow-sm: 0 1px 2px var(--ink-06), 0 2px 10px var(--ink-06);
  --shadow-md: 0 2px 6px var(--ink-06), 0 14px 34px var(--ink-10);
  --shadow-float: 0 10px 30px var(--ink-14);
  /* 書体・形 */
  --font-body: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  --font-head: 'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
  --radius-lg: 28px;
  --radius-md: 16px;
  --radius-sm: 10px;
  --header-h: 72px;
  --ease-out: cubic-bezier(.22, 1, .36, 1);
}

/* ---------- ベース ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--header-h) + 12px); -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font-body);
  font-size: 16px;
  font-weight: 500;
  line-height: 1.9;
  color: var(--charcoal);
  background: var(--paper);
  font-feature-settings: "palt" 1;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
img, svg { display: block; max-width: 100%; }
img { height: auto; }
a { color: inherit; }
button { font: inherit; color: inherit; }
ul, ol { list-style: none; }
h1, h2, h3 { font-family: var(--font-head); color: var(--ink); line-height: 1.45; }
/* 日本語の改行: 見出しや短い行は文節で折り返し、1文字だけ次の行に落ちるのを防ぐ */
h1, h2, h3, h4, summary, dt, dd, li, figcaption, .btn, .sec-lead,
.hero-lead, .hero-partner, .day-stage-cap, .bring-note, .photo-policy, .footer-brand p { word-break: auto-phrase; overflow-wrap: break-word; }
/* 途中で折りたくない語句は span.phrase で囲む */
.phrase { display: inline-block; }
h1, h2, h3, h4, summary { text-wrap: balance; }
p, li, dd { text-wrap: pretty; }
:focus-visible { outline: 3px solid var(--coral-deep); outline-offset: 3px; border-radius: 4px; }
::selection { background: var(--yellow); color: var(--ink); }

.container { width: min(100% - 40px, 1120px); margin-inline: auto; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: fixed; top: 12px; left: 12px; z-index: 100;
  padding: 10px 18px; border-radius: var(--radius-sm);
  background: var(--ink); color: var(--paper); font-weight: 700; text-decoration: none;
  transform: translateY(-200%); transition: transform .2s;
}
.skip-link:focus { transform: none; }

/* アイコン（本文冒頭のスプライトを <use> で呼ぶ） */
.ico { width: 20px; height: 20px; flex: none; stroke-width: 2; }

/* 本文中のリンク */
p a, dd a { color: var(--teal-text); font-weight: 700; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .22em; }
p a:hover, dd a:hover { text-decoration-thickness: 2px; }

/* ロゴの三色ストライプ（見出しの小さな印） */
.stripe-mark {
  display: inline-block; width: 40px; height: 10px; border-radius: 999px;
  background: repeating-linear-gradient(-55deg, var(--coral) 0 9px, var(--yellow) 9px 18px, var(--mint-deep) 18px 27px);
}

/* ---------- セクション共通 ---------- */
section.block { padding-block: clamp(72px, 9vw, 120px); }
.is-tinted { background: var(--mint-soft); }
.sec-head { max-width: 40em; margin-bottom: clamp(36px, 5vw, 56px); }
.sec-head h2 {
  margin-top: 14px;
  font-weight: 900; font-size: clamp(26px, 3.4vw, 38px); line-height: 1.4; letter-spacing: .03em;
}
.sec-lead { margin-top: 14px; font-size: 17px; color: var(--charcoal-soft); }
.sub-title { font-weight: 900; font-size: clamp(20px, 2.4vw, 26px); letter-spacing: .02em; }

/* スクロールで1回だけ表示（JS が .visible を付ける） */
.reveal { opacity: 0; transform: translateY(12px); transition: opacity .6s var(--ease-out), transform .6s var(--ease-out); }
.reveal.visible { opacity: 1; transform: none; }
@media (scripting: none) { .reveal { opacity: 1; transform: none; } }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 56px; padding: 12px 28px; border-radius: 999px; border: 2px solid transparent;
  font-family: var(--font-head); font-weight: 700; font-size: 16px; line-height: 1.4;
  text-decoration: none; text-align: center; cursor: pointer;
  transition: background-color .2s, color .2s, border-color .2s, box-shadow .2s, transform .2s var(--ease-out);
}
.btn .ico { width: 22px; height: 22px; }
.btn-primary { background: var(--ink); color: var(--paper); }
.btn-primary:hover { background: var(--charcoal); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.btn-primary .ico-line { color: var(--line-green); }
.btn-outline { border-color: var(--ink); color: var(--ink); background: transparent; }
.btn-outline:hover { background: var(--ink); color: var(--paper); }
.btn-soft { background: var(--paper); border-color: var(--line); color: var(--ink); }
.btn-soft:hover { border-color: var(--ink); }
.btn-sm { min-height: 44px; padding: 8px 20px; font-size: 15px; }
.btn-sm .ico { width: 20px; height: 20px; }

/* ---------- ヘッダー ---------- */
.site-header {
  position: fixed; inset: 0 0 auto; z-index: 50; height: var(--header-h);
  transition: background-color .3s, box-shadow .3s;
}
.site-header.is-scrolled, .site-header.is-open {
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  box-shadow: 0 1px 0 var(--ink-10);
}
.site-header .container { height: 100%; display: flex; align-items: center; gap: 12px; }
.brand { margin-right: auto; transition: opacity .3s, visibility .3s; }
.brand img { height: 40px; width: auto; }
/* ページ最上部ではヒーローの大きなロゴが主役なので、ヘッダーのロゴは隠す */
.site-header:not(.is-scrolled):not(.is-open) .brand { opacity: 0; visibility: hidden; }
.site-nav { display: none; }
.header-cta { display: none; }
.nav-toggle {
  width: 44px; height: 44px; border: 0; border-radius: 50%;
  background: var(--paper); box-shadow: var(--shadow-sm);
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
}
.bars { position: relative; display: block; width: 20px; height: 14px; }
.bars span {
  position: absolute; left: 0; width: 100%; height: 2px; border-radius: 2px; background: currentColor;
  transition: transform .3s var(--ease-out), opacity .2s;
}
.bars span:nth-child(1) { top: 0; }
.bars span:nth-child(2) { top: 6px; }
.bars span:nth-child(3) { top: 12px; }
.nav-toggle[aria-expanded="true"] .bars span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav-toggle[aria-expanded="true"] .bars span:nth-child(2) { opacity: 0; }
.nav-toggle[aria-expanded="true"] .bars span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

@media (min-width: 640px) {
  .header-cta { display: inline-flex; }
}
@media (min-width: 900px) {
  .site-nav { display: block; }
  .site-nav ul { display: flex; }
  .site-nav a {
    display: block; padding: 8px 8px; border-radius: 999px;
    font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; white-space: nowrap;
    transition: background-color .2s;
  }
  .site-nav a:hover { background: var(--mint-soft); }
  .header-cta { padding-inline: 18px; }
  .nav-toggle { display: none; }
  .site-header:not(.is-scrolled):not(.is-open) .site-nav ul {
    padding: 4px; border-radius: 999px; background: var(--glass); box-shadow: var(--shadow-sm);
    -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  }
}
@media (min-width: 1080px) {
  .site-nav ul { gap: 2px; }
  .site-nav a { padding: 8px 14px; font-size: 15px; }
  .site-header .container { gap: 20px; }
}

/* ---------- モバイルメニュー ---------- */
.mobile-menu {
  position: fixed; inset: var(--header-h) 0 0; z-index: 49;
  background: var(--paper); overflow-y: auto; overscroll-behavior: contain;
  padding: 8px 20px 40px;
  opacity: 0; visibility: hidden; transform: translateY(-8px);
  transition: opacity .25s, transform .3s var(--ease-out), visibility 0s .3s;
}
.mobile-menu.is-open { opacity: 1; visibility: visible; transform: none; transition: opacity .25s, transform .3s var(--ease-out); }
.menu-link {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 4px; border-bottom: 1px solid var(--line);
  font-family: var(--font-head); font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none;
}
.menu-link .ico { width: 18px; height: 18px; color: var(--charcoal-soft); }
.menu-cta { display: grid; gap: 10px; margin-top: 24px; }
.menu-sns { display: flex; justify-content: center; gap: 12px; margin-top: 24px; }
.menu-sns a {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: var(--mint-soft); color: var(--ink);
}
@media (min-width: 900px) { .mobile-menu { display: none; } }

/* ---------- ヒーロー（全面写真のスライドショー） ----------
   写真は photos/hero-1.jpg 〜 hero-5.jpg（1920×1280）。JS が 6 秒ごとに .is-active を回す。
   スマホ: 写真の下に白いパネルが重なる / 900px〜: 写真が全面、パネルは左下 */
.hero { position: relative; display: grid; background: var(--brand-sky); overflow: hidden; }
.hero-media { position: relative; height: max(360px, 62svh); }
.hero-slides { position: absolute; inset: 0; background: var(--mint); }
/* ヘッダーの上だけ少し暗くして、ハンバーガーやナビを写真の上でも見やすくする */
.hero-media::after {
  content: ""; position: absolute; inset: 0 0 auto; height: 160px; z-index: 3; pointer-events: none;
  background: linear-gradient(var(--ink-14), transparent);
}
.hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
.hero-slide.is-active { opacity: 1; z-index: 2; }
.hero-slide.is-leaving { opacity: 1; z-index: 1; }
.hero-slide img { width: 100%; height: 100%; object-fit: cover; }
/* 表示中の写真だけ、ゆっくり寄る */
.hero-slide.is-active img, .hero-slide.is-leaving img { animation: hero-zoom 8s linear both; }
@keyframes hero-zoom { from { transform: scale(1); } to { transform: scale(1.06); } }
.hero.is-paused .hero-slide img { animation-play-state: paused; }

/* 一時停止ボタンと写真の切り替え（JS が動くときだけ hidden を外す） */
.hero-controls {
  position: absolute; z-index: 4; right: 16px; bottom: 48px;
  display: flex; align-items: center; gap: 2px; padding: 4px 10px 4px 4px; border-radius: 999px;
  background: var(--glass); box-shadow: var(--shadow-sm);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
}
.hero-controls[hidden] { display: none; }
.hero-toggle {
  width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent;
  display: grid; place-items: center; cursor: pointer; color: var(--ink); transition: background-color .2s;
}
.hero-toggle:hover { background: var(--ink-06); }
.hero-toggle .ico { width: 18px; height: 18px; }
.hero-toggle .ico-play, .hero.is-stopped .hero-toggle .ico-pause { display: none; }
.hero.is-stopped .hero-toggle .ico-play { display: block; }
.hero-dots { display: flex; }
.hero-dot { position: relative; width: 24px; height: 44px; border: 0; background: transparent; cursor: pointer; transition: width .3s var(--ease-out); }
.hero-dot::before, .hero-dot::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px;
  border-radius: 999px; background: var(--charcoal-soft);
  transition: width .3s var(--ease-out), margin .3s var(--ease-out), background-color .3s;
}
.hero-dot::after { display: none; }
.hero-dot:hover::before { background: var(--ink); }
/* 表示中の写真: 横長のバーが、次の写真までの時間で満ちていく */
.hero-dot[aria-current="true"] { width: 44px; }
.hero-dot[aria-current="true"]::before, .hero-dot[aria-current="true"]::after { width: 28px; margin-left: -14px; }
.hero-dot[aria-current="true"]::before { background: var(--ink-14); }
.hero-dot[aria-current="true"]::after {
  display: block; background: var(--ink); transform-origin: left center;
  animation: dot-fill var(--hero-interval, 6s) linear both;
}
.hero.is-paused .hero-dot::after { animation-play-state: paused; }
.hero.is-stopped .hero-dot[aria-current="true"]::after { animation: none; transform: none; }
@keyframes dot-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.hero-panel {
  position: relative; z-index: 3; margin-top: -32px;
  background: var(--paper); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}
.hero-panel-inner { width: min(100% - 40px, 1120px); margin-inline: auto; padding: 32px 0 44px; }
.hero-logo { line-height: 0; }
.hero-logo img { width: min(100%, 240px); }
.hero-copy {
  margin-top: 16px;
  font-family: var(--font-head); font-weight: 900; color: var(--ink);
  font-size: clamp(24px, 3vw, 34px); line-height: 1.4; letter-spacing: .04em;
}
.hero-lead { margin-top: 12px; max-width: 30em; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.hero-actions .btn { flex: 1 1 100%; }
.hero-sub { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px; margin-top: 16px; }
.hero-partner { font-size: 15px; font-weight: 700; }
.hero-partner a { display: inline-block; padding-block: 8px; color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .3em; }
.hero-partner a:hover { color: var(--teal-text); }
.hero-affil { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: var(--charcoal); }
.hero-affil img { height: 24px; width: auto; }

@media (min-width: 640px) {
  .hero-media { height: max(420px, 58svh); }
  .hero-actions .btn { flex: 0 1 auto; }
  .hero-logo img { width: min(100%, 280px); }
  .hero-controls { right: 24px; }
}
@media (min-width: 900px) {
  .hero { min-height: max(640px, 100svh); align-items: end; }
  .hero-media { position: absolute; inset: 0; height: auto; }
  /* パネルの左端はページの .container にそろえる（% はヒーローの幅に対する値） */
  .hero-panel {
    justify-self: start; margin: 0;
    width: calc(max(20px, (100% - 1120px) / 2) + 560px);
    padding-left: max(20px, calc((100% - 1120px) / 2));
    border-radius: 0 44px 0 0;
  }
  .hero-panel-inner { width: auto; margin: 0; padding: 40px 48px 36px 0; }
  .hero-controls { right: max(20px, calc((100% - 1120px) / 2)); bottom: 32px; }
}
@media (min-width: 1080px) {
  .hero-panel { width: calc(max(20px, (100% - 1120px) / 2) + 600px); }
  .hero-panel-inner { padding: 48px 56px 40px 0; }
  .hero-logo img { width: min(100%, 300px); }
}

/* ---------- お知らせ ---------- */
/* 下の線は本文の幅だけ（全幅にするとページがここで区切られて見える） */
.news-inner { display: grid; gap: 6px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.news-title { font-size: 16px; font-weight: 700; }
.news-list { display: grid; gap: 4px; }
.news-list li { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 12px; font-size: 15px; line-height: 1.75; }
.news-date { font-weight: 700; color: var(--teal-text); font-variant-numeric: tabular-nums; }
@media (min-width: 900px) {
  .news-inner { grid-template-columns: 8em minmax(0, 1fr); align-items: baseline; padding-block: 28px; }
}

/* ---------- わたしたちのこと ----------
   写真は photos/about-1.jpg（縦 900×1200）と about-2.jpg（横 1200×900）。2枚を少し重ねて置く */
.about-grid { display: grid; gap: 32px; grid-template-areas: "head" "media" "body"; }
.about-grid > * { min-width: 0; }
.about-grid > .sec-head { grid-area: head; margin-bottom: 0; }
.about-media { grid-area: media; position: relative; padding-bottom: 56px; }
.about-story { grid-area: body; }
.about-photo img { width: 100%; height: 100%; object-fit: cover; }
.about-photo-main { width: 76%; margin-left: auto; aspect-ratio: 3 / 4; border-radius: var(--radius-lg); overflow: hidden; }
.about-photo-sub {
  position: absolute; left: 0; bottom: 0; width: 58%; aspect-ratio: 4 / 3;
  border: 8px solid var(--paper); border-radius: calc(var(--radius-lg) + 8px); overflow: hidden;
  box-shadow: var(--shadow-md);
}
.about-story > p:first-child { font-family: var(--font-head); font-weight: 700; font-size: clamp(18px, 2vw, 20px); line-height: 1.8; color: var(--ink); }
.about-story p + p { margin-top: 1.1em; }
.about-story .about-name { margin-top: 1.6em; color: var(--charcoal-soft); }

.bridge-wrap { margin-top: clamp(56px, 8vw, 96px); }
.bridge-wrap .sub-title { margin-bottom: 20px; }
.bridge-head { display: none; }
.bridge { border-top: 2px solid var(--ink); }
.bridge li { display: grid; gap: 6px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.bridge-issue { position: relative; padding-left: 20px; font-size: 15px; color: var(--charcoal-soft); }
.bridge-issue::before { content: ""; position: absolute; left: 2px; top: .72em; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
.bridge-arrow { width: 22px; height: 22px; margin-left: 15px; color: var(--teal); transform: rotate(90deg); stroke-width: 2.2; }
.bridge-answer { font-weight: 700; color: var(--ink); }

@media (min-width: 900px) {
  .about-grid {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    grid-template-areas: "head media" "body media";
    grid-template-rows: auto 1fr; column-gap: 72px; row-gap: 32px;
  }
  .about-media { align-self: start; padding-bottom: 72px; }
  .about-photo-sub { width: 56%; left: -40px; }
  .bridge-head, .bridge li { grid-template-columns: minmax(0, 1fr) 72px minmax(0, 1fr); }
  .bridge-head { display: grid; padding-bottom: 10px; font-size: 13px; font-weight: 700; color: var(--charcoal-soft); }
  .bridge-head span:last-child { grid-column: 3; }
  .bridge li { align-items: center; gap: 0; padding: 24px 0; }
  .bridge-arrow { margin: 0 auto; transform: none; }
}
@media (min-width: 1080px) {
  .about-grid { column-gap: 96px; }
}

/* ---------- 活動内容 ----------
   写真は photos/act-1.jpg 〜 act-4.jpg（1200×900）。PC では2列を上下にずらして並べる */
.acts { display: grid; gap: 44px; }
.act { min-width: 0; }
.act-photo { aspect-ratio: 4 / 3; border-radius: var(--radius-lg); overflow: hidden; background: var(--mint); }
.act-photo img { width: 100%; height: 100%; object-fit: cover; }
.act h3 { margin-top: 20px; font-size: clamp(20px, 2.2vw, 24px); font-weight: 900; letter-spacing: .02em; }
.act p { margin-top: 8px; max-width: 30em; }
@media (min-width: 640px) {
  .acts { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px 28px; }
}
@media (min-width: 900px) {
  .acts { column-gap: 64px; row-gap: 64px; padding-bottom: 112px; }
  .act:nth-child(even) { translate: 0 112px; }
}
@media (min-width: 1080px) {
  .acts { column-gap: 96px; }
}

/* ---------- ある日の活動 ----------
   スマホ: 写真つきの縦タイムライン / 900px〜: 左に手順、右に固定の写真（スクロールで切り替わる） */
.day-steps { position: relative; display: grid; gap: 40px; }
/* 番号をつなぐ線（--day-line まで珊瑚色で満ちる。JS が値を入れる） */
.day-steps::before, .day-steps::after {
  content: ""; position: absolute; left: 19px; top: 20px; width: 2px; border-radius: 2px;
}
.day-steps::before { bottom: 20px; background: var(--line); }
.day-steps::after { height: var(--day-line, 0px); background: var(--coral); transition: height .6s var(--ease-out); }
.day-step { position: relative; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 16px; }
.day-photo { grid-column: 2; grid-row: 1; margin-bottom: 16px; aspect-ratio: 4 / 3; border-radius: var(--radius-md); overflow: hidden; background: var(--mint); }
.day-photo img { width: 100%; height: 100%; object-fit: cover; }
.day-num {
  grid-column: 1; grid-row: 2; position: relative; z-index: 1;
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--paper); border: 2px solid var(--ink);
  font-family: var(--font-head); font-weight: 900; font-size: 16px; line-height: 1; color: var(--ink);
  transition: background-color .3s, border-color .3s, color .3s;
}
.day-step.is-done .day-num { background: var(--ink); color: var(--paper); }
.day-step.is-active .day-num { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.day-text { grid-column: 2; grid-row: 2; min-width: 0; }
.day-text h3 { padding-top: 5px; font-size: 19px; font-weight: 900; line-height: 1.5; }
.day-text p { margin-top: 6px; font-size: 15px; }
.day-stage { display: none; }
@media (min-width: 900px) {
  .day-layout { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 72px; }
  .day-steps { gap: 0; }
  .day-photo { display: none; }
  .day-step { grid-template-rows: auto; min-height: 30vh; align-content: center; padding-block: 24px; }
  .day-num { grid-row: 1; }
  .day-text { grid-row: 1; }
  .day-text h3 { font-size: 21px; }
  .day-stage { display: block; align-self: start; position: sticky; top: calc(var(--header-h) + 32px); }
  .day-stage-frame { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-lg); overflow: hidden; background: var(--mint); box-shadow: var(--shadow-md); }
  .day-stage-frame img {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transform: scale(1.03); transition: opacity .6s ease, transform 1.2s var(--ease-out);
  }
  .day-stage-frame img.is-active { opacity: 1; transform: none; }
  .day-stage-cap { display: flex; align-items: baseline; gap: 16px; margin-top: 20px; }
  .day-stage-num { font-family: var(--font-head); font-weight: 900; font-size: 52px; line-height: 1; color: var(--coral-deep); font-variant-numeric: tabular-nums; }
  .day-stage-title { font-family: var(--font-head); font-weight: 700; font-size: 22px; line-height: 1.5; color: var(--ink); }
}
@media (min-width: 1080px) {
  .day-layout { gap: 96px; }
}

/* ---------- 大切にしていること ---------- */
.promise-grid {
  display: grid; gap: 1px; overflow: hidden;
  background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-lg);
}
.promise { background: var(--paper); padding: clamp(24px, 3.5vw, 40px); }
.promise-ico {
  width: 52px; height: 52px; margin-bottom: 16px; border-radius: 50%;
  display: grid; place-items: center; background: var(--mint-soft); color: var(--teal-text);
}
.promise-ico .ico { width: 26px; height: 26px; stroke-width: 1.9; }
.promise h3 { font-size: 19px; font-weight: 700; }
.promise p { margin-top: 8px; font-size: 15px; }
@media (min-width: 640px) {
  .promise-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- 参加までの流れ ---------- */
.flow-grid { display: grid; gap: 48px; }
.flow-grid > * { min-width: 0; }
.steps { border-top: 2px solid var(--ink); }
.step { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 28px 0; border-bottom: 1px solid var(--line); }
.step-num { font-family: var(--font-head); font-weight: 900; font-size: 44px; line-height: 1; color: var(--coral-deep); }
.step h3 { font-size: 20px; font-weight: 700; line-height: 1.5; }
.step p { margin-top: 6px; }
.step .step-note {
  display: inline-flex; align-items: flex-start; gap: 8px; margin-top: 12px; padding: 6px 14px 6px 10px;
  border-radius: var(--radius-sm); background: var(--mint-soft);
  font-size: 14px; font-weight: 700; line-height: 1.65; color: var(--teal-text);
}
.step-note .ico { width: 18px; height: 18px; margin-top: .2em; stroke-width: 2.6; }
.flow-side { display: grid; gap: 20px; align-content: start; }
.line-card, .bring { border-radius: var(--radius-lg); padding: 28px; }
.line-card { background: var(--mint-soft); }
.bring { background: var(--yellow-soft); }
.line-card h3, .bring h3 { font-size: 20px; font-weight: 900; }
.line-card p { margin-top: 8px; font-size: 15px; }
.line-card .btn { width: 100%; margin-top: 20px; }
.line-card .line-id { margin-top: 10px; font-size: 14px; text-align: center; color: var(--charcoal-soft); }
.check-list { display: grid; gap: 8px; margin-top: 14px; }
.check-list li { display: flex; align-items: flex-start; gap: 10px; font-weight: 700; color: var(--ink); line-height: 1.7; }
.check-list .ico { width: 20px; height: 20px; margin-top: .22em; color: var(--teal-text); stroke-width: 2.6; }
.bring-note { margin-top: 14px; font-size: 14px; color: var(--charcoal-soft); }
@media (min-width: 900px) {
  .flow-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 56px; align-items: start; }
  .step { grid-template-columns: 72px minmax(0, 1fr); padding: 32px 0; }
  .step-num { font-size: 52px; }
}

/* ---------- 活動の様子 ----------
   写真は photos/gallery-1.jpg 〜 gallery-8.jpg（1 と 3 は縦 900×1200、ほかは横 1200×900）。大小を混ぜたモザイク */
.gallery-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 150px; grid-auto-flow: dense; gap: 10px; }
.g { min-width: 0; border-radius: var(--radius-md); overflow: hidden; background: var(--mint); }
.g img { width: 100%; height: 100%; object-fit: cover; }
.g1, .g3 { grid-row: span 2; }
.g2, .g6 { grid-column: span 2; }
.gallery-foot { display: grid; gap: 18px; margin-top: 36px; }
.gallery-foot p { font-size: 15px; }
.gallery-foot .photo-policy { margin-top: 4px; font-size: 14px; color: var(--charcoal-soft); }
.gallery-foot .btn { justify-self: start; }
@media (min-width: 640px) {
  .gallery-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 170px; gap: 14px; }
}
@media (min-width: 900px) {
  .gallery-grid { grid-auto-rows: 210px; gap: 16px; }
  .gallery-foot { grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 32px; }
}
@media (min-width: 1080px) {
  .gallery-grid { grid-auto-rows: 240px; }
}

/* ---------- よくある質問 ---------- */
.faq-grid { display: grid; gap: 32px; }
.faq-grid > * { min-width: 0; }
.faq-head .sec-head { margin-bottom: 24px; }
.faq-group + .faq-group { margin-top: 48px; }
.faq-group-title {
  display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 2px solid var(--ink);
  font-size: 19px; font-weight: 900;
}
.faq-group-title::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--coral); flex: none; }
.faq-group.is-partner .faq-group-title::before { background: var(--teal); }
.faq-item { border-bottom: 1px solid var(--line); }
.faq-item summary {
  position: relative; list-style: none; cursor: pointer;
  padding: 20px 48px 20px 0;
  font-family: var(--font-head); font-weight: 700; font-size: 17px; line-height: 1.6; color: var(--ink);
  transition: color .2s;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary:hover { color: var(--teal-text); }
.plus { position: absolute; right: 2px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: var(--mint-soft); }
.plus::before, .plus::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 2px; margin: -1px 0 0 -6px;
  border-radius: 2px; background: var(--ink); transition: transform .25s var(--ease-out);
}
.plus::after { transform: rotate(90deg); }
.faq-item[open] .plus::after { transform: rotate(0deg); }
.faq-body { padding: 0 48px 22px 0; }
.faq-body p { font-size: 15.5px; }
@media (min-width: 900px) {
  .faq-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.75fr); gap: 72px; align-items: start; }
  .faq-head { position: sticky; top: calc(var(--header-h) + 32px); }
}

/* ---------- 参加する ---------- */
.join { background: var(--brand-sky); padding-block: clamp(72px, 9vw, 120px); }
.join-head { max-width: 36em; margin: 0 auto clamp(40px, 5vw, 56px); text-align: center; }
.join-head h2 { margin-top: 14px; font-weight: 900; font-size: clamp(28px, 4vw, 44px); line-height: 1.4; letter-spacing: .03em; }
.join-head .sec-lead { color: var(--charcoal); }
.join-grid { display: grid; gap: 20px; }
.join-grid > * { min-width: 0; }
.wanted { padding: 28px; border-radius: var(--radius-lg); background: var(--paper); }
.wanted h3 { font-size: 20px; font-weight: 900; }
.wanted { overflow: hidden; }
.join-photo { margin: -28px -28px 24px; aspect-ratio: 16 / 9; background: var(--mint); }
.join-photo img { width: 100%; height: 100%; object-fit: cover; }
.channels { display: grid; gap: 12px; align-content: start; }
.channel {
  display: flex; align-items: center; gap: 16px; padding: 18px 20px;
  border-radius: var(--radius-md); background: var(--paper); box-shadow: var(--shadow-sm);
  color: var(--ink); text-decoration: none;
  transition: box-shadow .2s, transform .2s var(--ease-out);
}
.channel:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.channel.is-line { box-shadow: 0 0 0 2px var(--line-green), var(--shadow-sm); }
.channel.is-line:hover { box-shadow: 0 0 0 2px var(--line-green), var(--shadow-md); }
.channel-icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.channel-icon .ico { width: 26px; height: 26px; }
.channel.is-line .channel-icon { background: var(--line-green); color: var(--paper); }
.channel.is-instagram .channel-icon { background: var(--coral-soft); }
.channel.is-mail .channel-icon { background: var(--yellow-soft); }
.channel-text { flex: 1; min-width: 0; display: grid; }
.channel-name { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-family: var(--font-head); font-weight: 700; font-size: 17px; line-height: 1.5; }
.channel-id { font-size: 14px; color: var(--charcoal-soft); overflow-wrap: anywhere; line-height: 1.6; }
.tag { padding: 1px 10px; border-radius: 999px; background: var(--yellow); font-family: var(--font-body); font-size: 12px; font-weight: 700; line-height: 1.7; color: var(--ink); }
.channel-chev { width: 20px; height: 20px; color: var(--charcoal-soft); stroke-width: 2.2; }
.channel-note { margin-top: 4px; font-size: 14px; color: var(--charcoal); word-break: auto-phrase; }

.partner {
  margin-top: clamp(40px, 6vw, 64px); padding: clamp(28px, 4vw, 48px);
  display: grid; gap: 32px; border-radius: var(--radius-lg); background: var(--paper); box-shadow: var(--shadow-sm);
}
.partner > * { min-width: 0; }
.partner h2 { margin-top: 12px; font-weight: 900; font-size: clamp(22px, 2.6vw, 28px); }
.partner-main > p { margin-top: 12px; }
.partner-list { display: grid; gap: 8px; margin-top: 16px; }
.partner-list li { position: relative; padding-left: 20px; font-weight: 700; color: var(--ink); line-height: 1.7; }
.partner-list li::before { content: ""; position: absolute; left: 2px; top: .66em; width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
.partner-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 24px; }
.mail-text { font-size: 14px; color: var(--charcoal-soft); overflow-wrap: anywhere; }
.consult { padding: 24px; border-radius: var(--radius-md); background: var(--mint-soft); }
.consult h3 { font-size: 17px; font-weight: 700; }
.consult ol { display: grid; gap: 14px; margin-top: 14px; }
.consult li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
.consult-num {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--paper); border: 2px solid var(--ink);
  font-family: var(--font-head); font-weight: 900; font-size: 14px; line-height: 1; color: var(--ink);
}
.consult strong { display: block; font-size: 15px; color: var(--ink); line-height: 1.6; }
.consult li p { font-size: 14px; color: var(--charcoal-soft); line-height: 1.7; }
@media (min-width: 900px) {
  .join-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 32px; align-items: start; }
  .partner { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 48px; align-items: start; }
}

/* ---------- 団体概要 ---------- */
.profile { padding-bottom: clamp(56px, 7vw, 88px); }
.profile-grid { display: grid; }
.profile-grid > * { min-width: 0; }
.profile-list { border-top: 2px solid var(--ink); }
.profile-list > div { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.profile-list dt { font-size: 14px; font-weight: 700; color: var(--charcoal-soft); line-height: 1.9; }
.profile-list dd { font-size: 15px; color: var(--ink); }
/* 団体概要と SNS はどちらも白地なので、罫線で区切る */
.profile + .connect { border-top: 1px solid var(--line); }
@media (min-width: 900px) {
  .profile-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 64px; align-items: start; }
  .profile .sec-head { margin-bottom: 0; }
  .profile-list > div { grid-template-columns: 8em minmax(0, 1fr); padding: 18px 0; }
}

/* ---------- SNS ---------- */
/* 1枚のパネルを罫線で区切る（gap 1px から下地の罫線色を見せる） */
.sns-list {
  display: grid; gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden;
}
.sns-list > li { background: var(--paper); }
.sns-item {
  display: flex; align-items: center; gap: 14px; height: 100%; padding: 18px 20px;
  color: var(--ink); text-decoration: none;
  transition: background-color .2s;
}
.sns-item:hover { background: var(--mint-soft); }
.sns-item:focus-visible { outline-offset: -4px; }
.sns-icon { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--paper); }
.sns-icon .ico { width: 22px; height: 22px; }
.sns-item.is-instagram .sns-icon { background: var(--coral-deep); }
.sns-item.is-line .sns-icon { background: var(--line-green); }
.sns-item.is-facebook .sns-icon { background: var(--facebook-blue); }
.sns-item.is-linkedin .sns-icon { background: var(--linkedin-blue); }
.sns-text { display: grid; min-width: 0; line-height: 1.6; }
.sns-name { font-family: var(--font-head); font-weight: 700; font-size: 16px; }
.sns-id, .sns-desc { font-size: 13px; color: var(--charcoal-soft); overflow-wrap: anywhere; }
@media (min-width: 640px) {
  .sns-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (min-width: 900px) {
  .sns-list { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sns-item { flex-direction: column; align-items: flex-start; padding: 26px 24px; }
}

/* ---------- フッター ---------- */
.site-footer { background: var(--mint-soft); padding-bottom: 112px; }
.footer-stripe { height: 10px; background: repeating-linear-gradient(-55deg, var(--coral) 0 14px, var(--yellow) 14px 28px, var(--mint-deep) 28px 42px); }
.footer-grid { display: grid; gap: 40px; padding-block: 56px 40px; }
.footer-grid > * { min-width: 0; }
.footer-brand img { width: 150px; }
.footer-brand p { margin-top: 16px; font-size: 14px; line-height: 1.85; color: var(--charcoal-soft); }
.footer-title { margin-bottom: 10px; font-size: 15px; font-weight: 700; }
.footer-nav ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 20px; }
.site-footer li a {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px;
  font-size: 14px; color: var(--charcoal); text-decoration: none;
}
.site-footer li a:hover { color: var(--teal-text); text-decoration: underline; text-underline-offset: .22em; }
.footer-sns .ico { width: 18px; height: 18px; }
.footer-bottom {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 20px;
  padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--charcoal-soft);
}
.to-top { display: inline-flex; align-items: center; min-height: 40px; color: var(--charcoal); font-weight: 700; text-decoration: none; }
.to-top:hover { color: var(--teal-text); text-decoration: underline; text-underline-offset: .22em; }
@media (min-width: 900px) {
  .site-footer { padding-bottom: 32px; }
  /* 3列目はメールアドレスが途中で折れないよう中身の幅に合わせる */
  .footer-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.5fr) auto; gap: 48px; }
}

/* ---------- モバイル固定 CTA ---------- */
.sticky-cta {
  position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 10px 10px 20px; border-radius: 999px;
  background: var(--glass-strong); box-shadow: var(--shadow-float);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transform: translateY(calc(100% + 24px)); transition: transform .4s var(--ease-out);
}
.sticky-cta.is-visible { transform: none; }
.sticky-text { display: grid; font-family: var(--font-head); font-weight: 700; font-size: 15px; line-height: 1.4; color: var(--ink); }
.sticky-text small { font-family: var(--font-body); font-size: 12px; font-weight: 500; color: var(--charcoal-soft); }
.sticky-cta .btn { flex: none; }
@media (min-width: 900px) { .sticky-cta { display: none; } }

/* ---------- 自由セクション（CMS で追加） ---------- */
.free-body { max-width: 40em; }
.free-body p + p { margin-top: 1.1em; }
.free-photo { margin-top: clamp(28px, 4vw, 40px); max-width: 880px; border-radius: var(--radius-lg); overflow: hidden; }
.free-photo img { width: 100%; height: auto; }

/* ---------- 動きを減らす設定 ---------- */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; animation-delay: 0s !important; }
  .reveal { opacity: 1; transform: none; }
  /* スライドショーは自動で動かさない（JS も停止状態で始める）。写真の寄りもしない */
  .hero-slide img { animation: none !important; }
  .day-stage-frame img { transform: none; }
}
</style>

<!-- ===== ヘッダー ===== -->
<header class="site-header" id="site-header">
  <div class="container">
    <a class="brand" href="#top" aria-label="ちるーむ トップへ">
      <img src="chiroom-logo.png" alt="ちるーむ" width="1200" height="467">
    </a>
    <nav class="site-nav" aria-label="サイト内ナビゲーション">
      <ul>
{{headerNav}}
      </ul>
    </nav>
    <a class="btn btn-primary btn-sm header-cta" href="{{lineUrl}}" target="_blank" rel="noopener">
      <svg class="ico ico-line" aria-hidden="true" focusable="false"><use href="#i-line"/></svg>
      LINEで相談する
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="メニューを開く">
      <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span>
    </button>
  </div>
</header>

<!-- ===== モバイルメニュー（ナビを変えたらヘッダー・フッターも同じように直す） ===== -->
<nav class="mobile-menu" id="mobile-menu" aria-label="メニュー">
  <ul>
{{menuNav}}
  </ul>
  <div class="menu-cta">
    <a class="btn btn-primary" href="{{lineUrl}}" target="_blank" rel="noopener">
      <svg class="ico ico-line" aria-hidden="true" focusable="false"><use href="#i-line"/></svg>
      LINEで相談する
    </a>
    <a class="btn btn-soft" href="mailto:{{email}}">
      <svg class="ico" aria-hidden="true" focusable="false"><use href="#i-mail"/></svg>
      メールで問い合わせる
    </a>
  </div>
  <div class="menu-sns">
{{menuSns}}
  </div>
</nav>

<main id="main">
{{main}}
</main>

<!-- ===== フッター ===== -->
<footer class="site-footer">
  <div class="footer-stripe" aria-hidden="true"></div>
  <div class="container">
    <div class="footer-grid">
      <div class="footer-brand">
        <img src="chiroom-logo.png" alt="ちるーむ" width="1200" height="467" loading="lazy">
        <p>{{footerText}}</p>
      </div>
      <nav class="footer-nav" aria-labelledby="footer-nav-title">
        <h2 class="footer-title" id="footer-nav-title">サイトマップ</h2>
        <ul>
{{footerNav}}
        </ul>
      </nav>
      <div class="footer-sns">
        <h2 class="footer-title">つながる</h2>
        <ul>
{{footerSns}}
        </ul>
      </div>
    </div>
    <div class="footer-bottom">
      <small>© <span id="copyright-year">{{year}}</span> {{copyright}}</small>
      <a class="to-top" href="#top">ページの先頭へ</a>
    </div>
  </div>
</footer>

<!-- モバイル固定 CTA（ヒーローを過ぎたら表示、参加セクションが見えている間は隠す） -->
<div class="sticky-cta" id="sticky-cta" aria-hidden="true">
  <span class="sticky-text">{{stickyText}}<small>{{stickySub}}</small></span>
  <a class="btn btn-primary btn-sm" href="{{lineUrl}}" target="_blank" rel="noopener" tabindex="-1">
    <svg class="ico ico-line" aria-hidden="true" focusable="false"><use href="#i-line"/></svg>
    {{stickyButton}}
  </a>
</div>

<script>
(function () {
  'use strict';
  var header = document.getElementById('site-header');
  var toggle = document.querySelector('.nav-toggle');
  var menu = document.getElementById('mobile-menu');
  var sticky = document.getElementById('sticky-cta');
  var hero = document.getElementById('top');
  var join = document.getElementById('join');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ヘッダー: スクロールしたら背景を付ける */
  function onScroll() {
    header.classList.toggle('is-scrolled', window.scrollY > 8);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  /* モバイルメニュー: 開いている間は背景を inert にし、Tab をメニューの中で循環させる */
  var behind = [document.querySelector('.skip-link'), header.querySelector('.brand'), header.querySelector('.header-cta'),
    document.getElementById('main'), document.querySelector('.site-footer'), sticky];
  function menuFocusables() {
    return [toggle].concat(Array.prototype.slice.call(menu.querySelectorAll('a[href], button')));
  }
  function setMenu(open) {
    toggle.setAttribute('aria-expanded', String(open));
    toggle.setAttribute('aria-label', open ? 'メニューを閉じる' : 'メニューを開く');
    menu.classList.toggle('is-open', open);
    header.classList.toggle('is-open', open);
    document.body.style.overflow = open ? 'hidden' : '';
    behind.forEach(function (el) { if (el) el.inert = open; });
    if (open) { var first = menu.querySelector('a'); if (first) first.focus(); }
  }
  toggle.addEventListener('click', function () {
    setMenu(toggle.getAttribute('aria-expanded') !== 'true');
  });
  menu.querySelectorAll('a').forEach(function (a) {
    a.addEventListener('click', function () { setMenu(false); });
  });
  document.addEventListener('keydown', function (e) {
    if (toggle.getAttribute('aria-expanded') !== 'true') return;
    if (e.key === 'Escape') { setMenu(false); toggle.focus(); return; }
    if (e.key === 'Tab') {
      var items = menuFocusables(), firstEl = items[0], lastEl = items[items.length - 1];
      var inside = items.indexOf(document.activeElement) !== -1;
      if (e.shiftKey && (document.activeElement === firstEl || !inside)) { e.preventDefault(); lastEl.focus(); }
      else if (!e.shiftKey && (document.activeElement === lastEl || !inside)) { e.preventDefault(); firstEl.focus(); }
    }
  });
  window.matchMedia('(min-width: 900px)').addEventListener('change', function (e) { if (e.matches) setMenu(false); });

  /* スクロール表示 */
  var revealEls = document.querySelectorAll('.reveal');
  if (reduceMotion || !('IntersectionObserver' in window)) {
    revealEls.forEach(function (el) { el.classList.add('visible'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) { entry.target.classList.add('visible'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.1, rootMargin: '0px 0px -8% 0px' });
    revealEls.forEach(function (el) { io.observe(el); });
  }

  /* モバイル固定 CTA: ヒーローを過ぎたら表示、参加セクションが見えている間は隠す */
  if ('IntersectionObserver' in window) {
    var heroVisible = true, joinVisible = false;
    function updateSticky() {
      var show = !heroVisible && !joinVisible;
      sticky.classList.toggle('is-visible', show);
      sticky.setAttribute('aria-hidden', String(!show));
      sticky.querySelector('a').setAttribute('tabindex', show ? '0' : '-1');
    }
    new IntersectionObserver(function (entries) { heroVisible = entries[0].isIntersecting; updateSticky(); }, { threshold: 0.15 }).observe(hero);
    if (join) new IntersectionObserver(function (entries) { joinVisible = entries[0].isIntersecting; updateSticky(); }, { threshold: 0.05 }).observe(join);
  }

  /* ヒーローのスライドショー
     6 秒ごとに写真を切り替える。止まる条件: 一時停止ボタン（is-stopped）/ ヒーローが画面外 / タブが裏にある。
     動きを減らす設定の人には、止まった状態で始める（ボタンで再生はできる） */
  var slides = hero.querySelectorAll('.hero-slide');
  var controls = hero.querySelector('.hero-controls');
  if (slides.length > 1 && controls) {
    var dots = controls.querySelectorAll('.hero-dot');
    var heroToggle = controls.querySelector('.hero-toggle');
    var INTERVAL = 6000;
    var current = 0, timer = null, startedAt = 0, remaining = INTERVAL;
    var userStopped = reduceMotion, offscreen = false;
    hero.style.setProperty('--hero-interval', INTERVAL / 1000 + 's');

    function showSlide(n) {
      if (n === current) return;
      var prev = slides[current];
      prev.classList.remove('is-active');
      prev.classList.add('is-leaving');
      prev.setAttribute('aria-hidden', 'true');
      setTimeout(function () { prev.classList.remove('is-leaving'); }, 1200);
      slides[n].classList.add('is-active');
      slides[n].removeAttribute('aria-hidden');
      dots[current].removeAttribute('aria-current');
      dots[n].setAttribute('aria-current', 'true');
      current = n;
    }
    function schedule(ms) {
      clearTimeout(timer);
      startedAt = Date.now();
      remaining = ms;
      timer = setTimeout(function () { showSlide((current + 1) % slides.length); schedule(INTERVAL); }, ms);
    }
    function updateSlideshow() {
      var run = !userStopped && !offscreen && !document.hidden;
      hero.classList.toggle('is-paused', !run);
      hero.classList.toggle('is-stopped', userStopped);
      if (run && !timer) {
        schedule(remaining);
      } else if (!run && timer) {
        clearTimeout(timer);
        timer = null;
        remaining = Math.max(0, remaining - (Date.now() - startedAt));
      }
    }
    function setToggleLabel() {
      heroToggle.setAttribute('aria-label', userStopped ? 'スライドショーを再生' : 'スライドショーを一時停止');
    }

    heroToggle.addEventListener('click', function () {
      userStopped = !userStopped;
      // 再生し直すと進み具合のバーが最初から満ちなおすので、時間も最初から数える
      if (!userStopped) remaining = INTERVAL;
      setToggleLabel();
      updateSlideshow();
    });
    dots.forEach(function (dot, i) {
      dot.addEventListener('click', function () {
        if (i === current) return;
        showSlide(i);
        remaining = INTERVAL;
        if (timer) schedule(INTERVAL);
      });
    });
    document.addEventListener('visibilitychange', updateSlideshow);
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries) {
        offscreen = !entries[0].isIntersecting;
        updateSlideshow();
      }).observe(hero);
    }
    controls.hidden = false;
    setToggleLabel();
    updateSlideshow();
  }

  /* ある日の活動: 画面の真ん中にきた手順を強調する。PC では右の写真と見出しも切り替える */
  var dayList = document.querySelector('.day-steps');
  if (dayList && 'IntersectionObserver' in window) {
    var daySteps = dayList.querySelectorAll('.day-step');
    var stageImgs = document.querySelectorAll('.day-stage-frame img');
    var stageNum = document.querySelector('.day-stage-num');
    var stageTitle = document.querySelector('.day-stage-title');
    var dayCurrent = 0;

    // 番号をつなぐ線を、いまの手順の番号まで伸ばす
    function updateDayLine() {
      var num = daySteps[dayCurrent].querySelector('.day-num');
      var r = num.getBoundingClientRect();
      var top = dayList.getBoundingClientRect().top;
      dayList.style.setProperty('--day-line', Math.max(0, r.top + r.height / 2 - top - 20) + 'px');
    }
    function setDay(n) {
      dayCurrent = n;
      daySteps.forEach(function (step, i) {
        step.classList.toggle('is-active', i === n);
        step.classList.toggle('is-done', i < n);
      });
      stageImgs.forEach(function (img, i) { img.classList.toggle('is-active', i === n); });
      if (stageNum) stageNum.textContent = daySteps[n].querySelector('.day-num').textContent;
      if (stageTitle) stageTitle.textContent = daySteps[n].querySelector('h3').textContent;
      updateDayLine();
    }
    var dayIO = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) setDay(Array.prototype.indexOf.call(daySteps, entry.target));
      });
    }, { rootMargin: '-45% 0px -45% 0px' });
    daySteps.forEach(function (step) { dayIO.observe(step); });
    window.addEventListener('resize', updateDayLine, { passive: true });
    window.addEventListener('load', updateDayLine);
  }

  /* 著作権表示の年 */
  var y = document.getElementById('copyright-year');
  if (y) y.textContent = String(new Date().getFullYear());
})();
</script>

</body>
</html>
